name: Sync main with upstream

on:
  schedule:
    - cron: "0 0 * * *"   # once every 24 hours at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/horriblename/hyprgrass.git || true
          git fetch upstream
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Rebase fork/main onto upstream/main
        run: |
          git checkout main

          # Attempt rebase
          git rebase upstream/main || true

          # If rebase produced no changes, exit
          git diff --quiet && exit 0

          # Restore your custom workflow files
          git restore --source=HEAD -- .github/workflows/update-pins.yml
          git restore --source=HEAD -- .github/workflows/sync.yml

          # Restore your custom pin file
          git restore --source=HEAD -- hyprpm.toml

          # Stage restored files
          git add .

          # Commit rebase result
          git commit -m "Rebase main onto upstream/main (custom files preserved)"

      - name: Push updated main
        run: |
          git push origin main --force-with-lease
