name: Sync main with upstream

on:
  schedule:
    - cron: "0 0 * * *"   # once every 24 hours at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/horriblename/hyprgrass.git || true
          git fetch upstream
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Rebase fork/main onto upstream/main
        run: |
          git checkout main

          # Force upstream commits to apply and auto-resolve conflicts
          git pull upstream main --rebase --strategy=recursive -X theirs

          # Exit if rebase produced no changes
          if git diff --quiet HEAD upstream/main; then
              echo "No changes after rebase."
              exit 0
          fi

          # Restore custom files AFTER rebase is complete
          git restore --source=HEAD -- .github/workflows/pin-latest-hyprland.yml
          git restore --source=HEAD -- .github/workflows/sync.yml
          git restore --source=HEAD -- hyprpm.toml

          git add .
          git commit -m "Sync main with upstream (custom files preserved)"


      - name: Push updated main
        run: |
          git push origin main --force-with-lease
